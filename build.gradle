buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Версия 8.2.0 хорошо работает с Gradle 8.5
        classpath 'com.android.tools.build:gradle:8.2.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
